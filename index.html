<!DOCTYPE html>
<html>
<head>
    <title>Swe's Fashion Boutique</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo-section">
            <img src="https://cdn-icons-png.flaticon.com/512/3050/3050236.png"
                 class="logo"
                 alt="Fashion Logo">
            <h1>Swe's Fashion Boutique</h1>
            <p>Wear Your Confidence</p>
        </div>
    </header>

    <nav>
        <ul>
            <li>
                <a href="#">Home</a>

                <ul class="dropdown">
                    <li><a href="#">New Arrivals</a></li>
                    <li><a href="#">Trending</a></li>
                    <li><a href="#">Best Sellers</a></li>
                    <li><a href="#">Offers</a></li>
                </ul>
            </li>
            <li><a href="#">Collections</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Others</a></li>

        </ul>
    </nav>

    <section class="container">
        <div class="box">
            <h2>Sign In</h2>
            <form>
                <label>Username</label>
                <input type="text"
                       placeholder="Enter Username / Email">
                <label>Password</label>
                <input type="password"
                       placeholder="Enter Password">
                <input type="submit" value="Sign In">
            </form>
        </div>

        <div class="box">
            <h2>Sign Up</h2>
            <form>
                <label>Name</label>
                <input type="text"
                       placeholder="Enter Name">
                <label>Email</label>
                <input type="email"
                       placeholder="Enter Email">
                <label>Password</label>
                <input type="password"
                       placeholder="Enter Password">
                <input type="submit" value="Sign Up">
            </form>
        </div>
    </section>

    <footer>
        <p><b>Swe's Fashion Boutique</b></p>
        <p>
            © Swe's Fashion Boutique
            All Rights Reserved.
        </p>
    </footer>
</body>
</html>
